[project]
name = "remove_apple_autosave"
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["gmail", "dedup"]

requires-python = ">=3.12,<4.0.0"
description = "remove apple backup files from gmail archive"
dependencies = [
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "ratelimiter",
  "ratelimit (>=2.2.1,<3.0.0)",
  "backoff (>=2.2.1,<3.0.0)"
]
authors = [
  {name = "Simson Garfinkel", email = "simsong@acm.org"},
]
maintainers = [
  {name = "Simson Garfinkel", email = "simsong@acm.org"},
]

[project.urls]
Repository = "https://github.com/simsong/remove_apple_autosave.git"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pylint = "*"


[tool.pylint.variables]
# Allow variable names that start with 'api_' or 'route_' to be unused
dummy-variables-rgx = "^(api_|route_).*"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
